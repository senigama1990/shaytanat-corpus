name: Build Shaytanat.exe

on:
  push:
    branches: [main]
    paths: ['VERSION', 'app/**', 'data/**', 'RELEASE_NOTES.md', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build exe
        working-directory: app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Shaytanat --icon icon.ico --add-data "web;web" shaytanat_app.pyw

      - name: Package data
        shell: pwsh
        run: Compress-Archive -Path data/* -DestinationPath Shaytanat_data.zip

      - name: Keep build output
        uses: actions/upload-artifact@v4
        with:
          name: Shaytanat
          path: |
            app/dist/Shaytanat.exe
            Shaytanat_data.zip

      - name: Read version
        shell: pwsh
        run: echo "VER=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_ENV

      # a release of the same version is rebuilt from the current commit
      - name: Remove previous release of this version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VER" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete "v$env:VER" --repo "${{ github.repository }}" --cleanup-tag --yes }
          exit 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Шайтанат ${{ env.VER }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            app/dist/Shaytanat.exe
            Shaytanat_data.zip
